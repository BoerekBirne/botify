<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Botify – Webplayer</title>

  <!-- iOS / Safari PWA Meta-Tags für Vollbild & Hintergrundbetrieb -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Botify PWA">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="">
  <link id="pwa-manifest" rel="manifest" href="">

  <style>
    :root {
      --bg-base: #000000;
      --bg-elevated-base: #121212;
      --bg-elevated-highlight: #1f1f1f;
      --bg-elevated-press: #2a2a2a;
      --bg-tinted-base: rgba(255, 255, 255, 0.07);
      --bg-tinted-highlight: rgba(255, 255, 255, 0.14);
      --text-base: #ffffff;
      --text-subdued: #b3b3b3;
      --essential-bright-accent: #1ed760;
      --essential-bright-accent-hover: #1fdf64;
      --panel-gap: 8px;
      --border-radius-panel: 8px;
      --top-bar-height: 64px;
      --player-bar-height: 80px;
      --mobile-nav-height: 56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-base);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--panel-gap);
      padding-top: calc(var(--panel-gap) + var(--safe-top));
      gap: var(--panel-gap);
      user-select: none;
    }

    /* SCROLLBAR STYLING */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* TOP BAR */
    .top-bar {
      height: var(--top-bar-height);
      min-height: var(--top-bar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
      flex: 1;
    }

    .logo-btn {
      background: transparent;
      border: none;
      color: var(--text-base);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .top-bar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 2;
      max-width: 540px;
    }

    .home-btn {
      background-color: var(--bg-elevated-highlight);
      border: none;
      color: var(--text-base);
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .home-btn:hover {
      background-color: var(--bg-elevated-press);
      transform: scale(1.04);
    }

    .search-box {
      background-color: var(--bg-elevated-highlight);
      border-radius: 500px;
      height: 48px;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border: 1px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .search-box:hover {
      background-color: var(--bg-elevated-press);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .search-box:focus-within {
      border-color: var(--text-base);
      background-color: var(--bg-elevated-press);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--text-base);
      font-size: 15px;
      width: 100%;
      outline: none;
      user-select: text;
    }

    .search-box input::placeholder {
      color: var(--text-subdued);
    }

    .search-divider {
      width: 1px;
      height: 24px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex: 1;
    }

    .api-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-tinted-base);
      padding: 6px 12px;
      border-radius: 500px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-subdued);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .api-status-badge:hover {
      background-color: var(--bg-tinted-highlight);
      color: var(--text-base);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f59e0b;
    }

    .status-dot.connected {
      background-color: var(--essential-bright-accent);
      box-shadow: 0 0 8px rgba(30, 215, 96, 0.6);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: color 0.2s ease, transform 0.1s ease, background-color 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--text-base);
      transform: scale(1.05);
    }

    .avatar-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-elevated-highlight);
      border: 2px solid var(--bg-elevated-base);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-base);
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.1s ease, border-color 0.2s ease;
      flex-shrink: 0;
    }

    /* MAIN WORKSPACE */
    .workspace {
      display: flex;
      flex: 1;
      gap: var(--panel-gap);
      min-height: 0;
    }

    .panel {
      background-color: var(--bg-elevated-base);
      border-radius: var(--border-radius-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left-sidebar {
      width: 320px;
      min-width: 280px;
      padding: 16px;
      gap: 16px;
    }

    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-subdued);
    }

    .library-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    .library-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 0 -8px;
      padding: 0 8px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .playlist-item:hover {
      background-color: var(--bg-elevated-highlight);
    }

    .playlist-item.active {
      background-color: var(--bg-elevated-press);
    }

    .playlist-cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background-color: var(--bg-elevated-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .playlist-cover.liked {
      background: linear-gradient(135deg, #450af5, #c4efd9);
      color: #fff;
    }

    .playlist-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-meta {
      font-size: 13px;
      color: var(--text-subdued);
      margin-top: 2px;
    }

    .main-view {
      flex: 1;
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 35%);
      padding: 16px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .chip {
      background-color: var(--bg-tinted-base);
      color: var(--text-base);
      border: none;
      border-radius: 500px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip.active {
      background-color: var(--text-base);
      color: var(--bg-base);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .music-card {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .music-card:hover {
      background-color: var(--bg-elevated-highlight);
    }

    .card-cover-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background-color: var(--bg-elevated-press);
      overflow: hidden;
    }

    .card-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 32px 48px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .track-row:hover {
      background-color: var(--bg-tinted-base);
    }

    .track-row.playing {
      background-color: var(--bg-tinted-highlight);
    }

    .track-index {
      font-size: 14px;
      color: var(--text-subdued);
      text-align: center;
    }

    .track-row.playing .track-index,
    .track-row.playing .track-title {
      color: var(--essential-bright-accent);
    }

    .track-thumb {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      object-fit: cover;
    }

    .track-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-subdued);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-duration {
      font-size: 13px;
      color: var(--text-subdued);
    }

    /* PLAYER BAR */
    .player-bar {
      height: var(--player-bar-height);
      min-height: var(--player-bar-height);
      background-color: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
    }

    .player-left {
      width: 30%;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cover-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background-color: var(--bg-elevated-highlight);
      overflow: hidden;
    }

    .cover-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .now-playing-info {
      min-width: 0;
      flex: 1;
    }

    .now-playing-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-artist {
      font-size: 12px;
      color: var(--text-subdued);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-center {
      width: 40%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: var(--text-base);
      color: var(--bg-base);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-subdued);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--text-base);
      border-radius: 2px;
    }

    .player-right {
      width: 30%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .volume-bar {
      width: 93px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .volume-fill {
      height: 100%;
      width: 80%;
      background-color: var(--text-base);
      border-radius: 2px;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background-color: #181818;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
    }

    .form-input {
      background-color: var(--bg-elevated-press);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-base);
      font-size: 14px;
      outline: none;
    }

    .btn-primary {
      background-color: var(--essential-bright-accent);
      color: #000;
      border: none;
      border-radius: 500px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--essential-bright-accent);
      color: #000;
      padding: 10px 20px;
      border-radius: 500px;
      font-weight: 700;
      opacity: 0;
      transition: 0.2s;
      z-index: 2000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    svg { fill: currentColor; }
  </style>
</head>
<body>

  <audio id="audio-player" playsinline preload="auto"></audio>

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="top-bar-left">
      <button class="logo-btn" id="btn-logo">
        <svg viewBox="0 0 24 24" width="32" height="32" style="transform: scaleX(-1);"><path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm5.045 15.866a.686.686 0 0 1-.943.228c-2.583-1.579-5.834-1.935-9.663-1.06a.686.686 0 0 1-.306-1.337c4.19-.957 7.785-.546 10.684 1.226a.686.686 0 0 1 .228.943zm1.346-2.995a.858.858 0 0 1-1.18.282c-2.956-1.817-7.464-2.344-10.961-1.282a.856.856 0 0 1-1.11-.904.858.858 0 0 1 .611-.737c3.996-1.212 8.962-.625 12.357 1.462a.857.857 0 0 1 .283 1.179zm.116-3.119c-3.546-2.106-9.395-2.3-12.78-1.272a1.029 1.029 0 0 1-.597-1.969c3.886-1.18 10.345-.952 14.427 1.471a1.029 1.029 0 0 1-1.05 1.77z"></path></svg>
      </button>
    </div>

    <div class="top-bar-center">
      <button class="home-btn" id="btn-home">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M13.5 1.515a3 3 0 0 0-3 0L3 5.845a2 2 0 0 0-1 1.732V21a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6h4v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7.577a2 2 0 0 0-1-1.732l-7.5-4.33z"></path></svg>
      </button>

      <div class="search-box">
        <svg viewBox="0 0 24 24" width="22" height="22" style="color: var(--text-subdued);"><path d="M10.533 1.27893C5.35215 1.27893 1.12598 5.41887 1.12598 10.5579C1.12598 15.697 5.35215 19.8369 10.533 19.8369C12.767 19.8369 14.8235 19.0671 16.4402 17.7794L20.7929 22.132C21.1834 22.5226 21.8166 22.5226 22.2071 22.132C22.5976 21.7415 22.5976 21.1083 22.2071 20.7178L17.8634 16.3741C19.1616 14.7849 19.94 12.7634 19.94 10.5579C19.94 5.41887 15.7138 1.27893 10.533 1.27893Z"></path></svg>
        <input type="text" id="search-input" placeholder="Was möchtest du wiedergeben?">
      </div>
    </div>

    <div class="top-bar-right">
      <div class="api-status-badge" id="api-status-badge">
        <span class="status-dot" id="api-status-dot"></span>
        <span id="api-status-text">Demo-Modus</span>
      </div>
      <button class="avatar-placeholder" id="btn-open-settings">⚙</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="workspace">
    <aside class="panel left-sidebar" id="sidebar-panel">
      <div class="library-header">
        <div class="library-title" id="btn-library-home">Bibliothek</div>
      </div>
      <div class="library-list" id="library-list"></div>
    </aside>

    <main class="panel main-view mobile-active" id="main-panel">
      <div class="chips-row" id="chips-row">
        <button class="chip active" data-filter="all">Alle</button>
      </div>
      <div id="main-content"></div>
    </main>
  </div>

  <!-- PLAYER BAR -->
  <footer class="player-bar">
    <div class="player-left">
      <div class="cover-placeholder" id="player-cover"></div>
      <div class="now-playing-info">
        <div class="now-playing-title" id="player-title">Kein Titel</div>
        <div class="now-playing-artist" id="player-artist">Wähle einen Song</div>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="play-btn" id="btn-play">▶</button>
      </div>
      <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <div class="volume-bar" id="volume-bar"><div class="volume-fill" id="volume-fill"></div></div>
    </div>
  </footer>

  <!-- SETTINGS MODAL -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Einstellungen</h2>
        <button class="icon-btn" id="btn-close-settings">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">Google API Key (YouTube Data API v3)</label>
        <input type="password" class="form-input" id="input-google-api-key" placeholder="AIzaSy...">
      </div>
      <div class="form-group">
        <label class="form-label">Audio-Stream-Proxy URL</label>
        <input type="url" class="form-input" id="input-stream-proxy" value="https://botify-aurb.onrender.com">
      </div>
      <button class="btn-primary" id="btn-save-settings">Speichern</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const audio = document.getElementById('audio-player');
    const PROXY_URL = 'https://botify-aurb.onrender.com';

    const STORAGE_KEYS = {
      API_KEY: 'botify_google_api_key_v1',
      STREAM_PROXY: 'botify_stream_proxy_v1',
      PLAYLISTS: 'botify_playlists_v1',
      VOLUME: 'botify_volume_v1'
    };

    const DEMO_TRACKS = [
      { id: 'demo-1', title: 'Lofi Study Beats', artist: 'Botify Chill', duration: 180, cover: 'https://placehold.co/400x400/121212/1ed760?text=Lofi', audioUrl: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7f6.mp3' }
    ];

    let state = {
      apiKey: localStorage.getItem(STORAGE_KEYS.API_KEY) || '',
      streamProxy: localStorage.getItem(STORAGE_KEYS.STREAM_PROXY) || PROXY_URL,
      volume: parseFloat(localStorage.getItem(STORAGE_KEYS.VOLUME) || '0.8'),
      queue: [...DEMO_TRACKS],
      currentIndex: -1,
      isPlaying: false,
      searchQuery: '',
      searchResults: [],
      playlists: [{ id: 'liked', name: 'Lieblingssongs', tracks: [] }]
    };

    audio.volume = state.volume;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function updateApiStatusUI() {
      const dot = document.getElementById('api-status-dot');
      const text = document.getElementById('api-status-text');
      if (state.apiKey.trim()) {
        dot.classList.add('connected');
        text.textContent = 'API verbunden';
      } else {
        dot.classList.remove('connected');
        text.textContent = 'Demo-Modus';
      }
    }

    // Proxy-Stream Resolver
    async function resolveBackgroundAudioStream(videoId) {
      try {
        const proxyBase = (state.streamProxy || PROXY_URL).replace(/\/+$/, '');
        const res = await fetch(`${proxyBase}/${videoId}`);
        if (res.ok) {
          const data = await res.json();
          if (data.url) return data.url;
        }
      } catch (err) {
        console.error("Proxy error:", err);
      }
      return null;
    }

    async function loadAndPlayTrack(index, customQueue = null) {
      if (customQueue) state.queue = [...customQueue];
      if (index < 0 || index >= state.queue.length) return;

      audio.pause();
      state.currentIndex = index;
      const track = state.queue[index];

      document.getElementById('player-title').textContent = track.title;
      document.getElementById('player-artist').textContent = track.artist;
      if (track.cover) {
        document.getElementById('player-cover').innerHTML = `<img src="${track.cover}" style="width:100%;height:100%;object-fit:cover;">`;
      }

      let directAudioUrl = track.audioUrl || null;
      if (!directAudioUrl && track.videoId) {
        showToast('Lade Audio-Stream...');
        directAudioUrl = await resolveBackgroundAudioStream(track.videoId);
      }

      if (directAudioUrl) {
        audio.src = directAudioUrl;
        audio.load();
        try {
          await audio.play();
          state.isPlaying = true;
          document.getElementById('btn-play').textContent = '⏸';
          return;
        } catch (e) {}
      }
      showToast('Stream konnte nicht geladen werden.');
    }

    // Suche über YouTube API
    async function searchMusic(query) {
      const q = query.trim();
      state.searchQuery = q;
      if (!q) {
        state.searchResults = [];
        renderMainView();
        return;
      }

      if (!state.apiKey.trim()) {
        const lower = q.toLowerCase();
        state.searchResults = DEMO_TRACKS.filter(t => t.title.toLowerCase().includes(lower));
        renderMainView();
        return;
      }

      try {
        const key = encodeURIComponent(state.apiKey.trim());
        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=${encodeURIComponent(q)}&key=${key}`);
        const data = await res.json();
        
        state.searchResults = (data.items || []).map(item => ({
          id: 'yt-' + item.id.videoId,
          videoId: item.id.videoId,
          title: item.snippet.title,
          artist: item.snippet.channelTitle,
          cover: item.snippet.thumbnails?.medium?.url || ''
        }));
      } catch (err) {
        showToast('Suchfehler aufgetreten');
        state.searchResults = [];
      }
      renderMainView();
    }

    function renderMainView() {
      const container = document.getElementById('main-content');
      if (state.searchQuery.trim()) {
        container.innerHTML = `
          <h2 class="section-title" style="margin-bottom:16px;">Suchergebnisse</h2>
          <div class="track-list" id="search-list">
            ${state.searchResults.map((t, i) => `
              <div class="track-row" data-idx="${i}">
                <div class="track-index">${i+1}</div>
                <img class="track-thumb" src="${t.cover}">
                <div class="track-meta">
                  <div class="track-title">${t.title}</div>
                  <div class="track-artist">${t.artist}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.querySelectorAll('.track-row').forEach(row => {
          row.addEventListener('click', () => loadAndPlayTrack(parseInt(row.dataset.idx), state.searchResults));
        });
      } else {
        container.innerHTML = `
          <h2 class="section-title" style="margin-bottom:16px;">Empfohlen</h2>
          <div class="track-list" id="demo-list">
            ${DEMO_TRACKS.map((t, i) => `
              <div class="track-row" data-idx="${i}">
                <div class="track-index">${i+1}</div>
                <img class="track-thumb" src="${t.cover}">
                <div class="track-meta">
                  <div class="track-title">${t.title}</div>
                  <div class="track-artist">${t.artist}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.querySelectorAll('.track-row').forEach(row => {
          row.addEventListener('click', () => loadAndPlayTrack(parseInt(row.dataset.idx), DEMO_TRACKS));
        });
      }
    }

    // Events
    document.getElementById('btn-play').addEventListener('click', () => {
      if (state.currentIndex === -1 && state.queue.length > 0) {
        loadAndPlayTrack(0);
      } else if (state.isPlaying) {
        audio.pause();
        state.isPlaying = false;
        document.getElementById('btn-play').textContent = '▶';
      } else {
        audio.play();
        state.isPlaying = true;
        document.getElementById('btn-play').textContent = '⏸';
      }
    });

    let searchTimeout;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => searchMusic(e.target.value), 350);
    });

    document.getElementById('btn-open-settings').addEventListener('click', () => {
      document.getElementById('input-google-api-key').value = state.apiKey;
      document.getElementById('input-stream-proxy').value = state.streamProxy;
      document.getElementById('settings-modal').classList.add('open');
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').classList.remove('open');
    });

    document.getElementById('btn-save-settings').addEventListener('click', () => {
      state.apiKey = document.getElementById('input-google-api-key').value.trim();
      state.streamProxy = document.getElementById('input-stream-proxy').value.trim() || PROXY_URL;
      localStorage.setItem(STORAGE_KEYS.API_KEY, state.apiKey);
      localStorage.setItem(STORAGE_KEYS.STREAM_PROXY, state.streamProxy);
      updateApiStatusUI();
      document.getElementById('settings-modal').classList.remove('open');
      showToast('Einstellungen gespeichert');
    });

    updateApiStatusUI();
    renderMainView();
  </script>
</body>
</html>
