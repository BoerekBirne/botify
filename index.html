<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Botify – Webplayer</title>

  <!-- iOS / Safari PWA Meta-Tags für Vollbild & Hintergrundbetrieb -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Botify PWA">
  <meta name="theme-color" content="#000000">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="">
  <link id="pwa-manifest" rel="manifest" href="">

  <style>
    :root {
      --bg-base: #000000;
      --bg-elevated-base: #121212;
      --bg-elevated-highlight: #1f1f1f;
      --bg-elevated-press: #2a2a2a;
      --bg-tinted-base: rgba(255, 255, 255, 0.07);
      --bg-tinted-highlight: rgba(255, 255, 255, 0.14);
      --text-base: #ffffff;
      --text-subdued: #b3b3b3;
      --essential-bright-accent: #1ed760;
      --essential-bright-accent-hover: #1fdf64;
      --panel-gap: 8px;
      --border-radius-panel: 8px;
      --top-bar-height: 64px;
      --player-bar-height: 80px;
      --mobile-nav-height: 56px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-base);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--panel-gap);
      padding-top: calc(var(--panel-gap) + var(--safe-top));
      gap: var(--panel-gap);
      user-select: none;
    }

    /* SCROLLBAR STYLING */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* TOP BAR */
    .top-bar {
      height: var(--top-bar-height);
      min-height: var(--top-bar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 24px;
      flex: 1;
    }

    .logo-btn {
      background: transparent;
      border: none;
      color: var(--text-base);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .top-bar-center {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 2;
      max-width: 540px;
    }

    .home-btn {
      background-color: var(--bg-elevated-highlight);
      border: none;
      color: var(--text-base);
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .home-btn:hover {
      background-color: var(--bg-elevated-press);
      transform: scale(1.04);
    }

    .search-box {
      background-color: var(--bg-elevated-highlight);
      border-radius: 500px;
      height: 48px;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      border: 1px solid transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .search-box:hover {
      background-color: var(--bg-elevated-press);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .search-box:focus-within {
      border-color: var(--text-base);
      background-color: var(--bg-elevated-press);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--text-base);
      font-size: 15px;
      width: 100%;
      outline: none;
      user-select: text;
    }

    .search-box input::placeholder {
      color: var(--text-subdued);
    }

    .search-divider {
      width: 1px;
      height: 24px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex: 1;
    }

    .api-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--bg-tinted-base);
      padding: 6px 12px;
      border-radius: 500px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-subdued);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      white-space: nowrap;
    }

    .api-status-badge:hover {
      background-color: var(--bg-tinted-highlight);
      color: var(--text-base);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #f59e0b;
    }

    .status-dot.connected {
      background-color: var(--essential-bright-accent);
      box-shadow: 0 0 8px rgba(30, 215, 96, 0.6);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: color 0.2s ease, transform 0.1s ease, background-color 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      color: var(--text-base);
      transform: scale(1.05);
    }

    .icon-btn.active {
      color: var(--essential-bright-accent);
      position: relative;
    }

    .icon-btn.active::after {
      content: '';
      position: absolute;
      bottom: 2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: var(--essential-bright-accent);
    }

    .avatar-placeholder {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-elevated-highlight);
      border: 2px solid var(--bg-elevated-base);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-base);
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.1s ease, border-color 0.2s ease;
      flex-shrink: 0;
    }

    .avatar-placeholder:hover {
      transform: scale(1.06);
      border-color: var(--essential-bright-accent);
    }

    /* MAIN WORKSPACE */
    .workspace {
      display: flex;
      flex: 1;
      gap: var(--panel-gap);
      min-height: 0;
    }

    .panel {
      background-color: var(--bg-elevated-base);
      border-radius: var(--border-radius-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* LEFT SIDEBAR (LIBRARY) */
    .left-sidebar {
      width: 320px;
      min-width: 280px;
      padding: 16px;
      gap: 16px;
    }

    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-subdued);
    }

    .library-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .library-title:hover {
      color: var(--text-base);
    }

    .library-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .library-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 0 -8px;
      padding: 0 8px;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .playlist-item:hover {
      background-color: var(--bg-elevated-highlight);
    }

    .playlist-item.active {
      background-color: var(--bg-elevated-press);
    }

    .playlist-cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      background-color: var(--bg-elevated-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      font-size: 18px;
    }

    .playlist-cover.liked {
      background: linear-gradient(135deg, #450af5, #c4efd9);
      color: #fff;
    }

    .playlist-info {
      flex: 1;
      min-width: 0;
    }

    .playlist-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item.active .playlist-name {
      color: var(--essential-bright-accent);
    }

    .playlist-meta {
      font-size: 13px;
      color: var(--text-subdued);
      margin-top: 2px;
    }

    /* MAIN VIEW */
    .main-view {
      flex: 1;
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 35%);
      padding: 16px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .chip {
      background-color: var(--bg-tinted-base);
      color: var(--text-base);
      border: none;
      border-radius: 500px;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .chip:hover {
      background-color: var(--bg-tinted-highlight);
    }

    .chip.active {
      background-color: var(--text-base);
      color: var(--bg-base);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .music-card {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .music-card:hover {
      background-color: var(--bg-elevated-highlight);
    }

    .card-cover-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      overflow: hidden;
      background-color: var(--bg-elevated-press);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .card-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-subdued);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* TRACK LIST */
    .track-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-row {
      display: grid;
      grid-template-columns: 32px 48px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .track-row:hover {
      background-color: var(--bg-tinted-base);
    }

    .track-row.playing {
      background-color: var(--bg-tinted-highlight);
    }

    .track-index {
      font-size: 14px;
      color: var(--text-subdued);
      text-align: center;
    }

    .track-row.playing .track-index,
    .track-row.playing .track-title {
      color: var(--essential-bright-accent);
    }

    .track-thumb {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      object-fit: cover;
      background-color: var(--bg-elevated-press);
    }

    .track-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .track-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-subdued);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .track-duration {
      font-size: 13px;
      color: var(--text-subdued);
      min-width: 40px;
      text-align: right;
    }

    /* NOW PLAYING BAR (BOTTOM) */
    .player-bar {
      height: var(--player-bar-height);
      min-height: var(--player-bar-height);
      background-color: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
    }

    .player-left {
      width: 30%;
      min-width: 180px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cover-placeholder {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      background-color: var(--bg-elevated-highlight);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .now-playing-info {
      min-width: 0;
      flex: 1;
    }

    .now-playing-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-base);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .now-playing-artist {
      font-size: 12px;
      color: var(--text-subdued);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .player-center {
      width: 40%;
      max-width: 722px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .play-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: var(--text-base);
      color: var(--bg-base);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .play-btn:hover {
      transform: scale(1.06);
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-subdued);
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-bar:hover {
      height: 6px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--text-base);
      border-radius: 2px;
      pointer-events: none;
    }

    .progress-bar:hover .progress-fill {
      background-color: var(--essential-bright-accent);
    }

    .player-right {
      width: 30%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .volume-bar {
      width: 93px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .volume-fill {
      height: 100%;
      width: 80%;
      background-color: var(--text-base);
      border-radius: 2px;
      pointer-events: none;
    }

    .volume-bar:hover .volume-fill {
      background-color: var(--essential-bright-accent);
    }

    /* MODALS & DRAWERS */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background-color: #181818;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.7);
      max-height: 90dvh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-base);
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-subdued);
      line-height: 1.45;
    }

    .form-input {
      background-color: var(--bg-elevated-press);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 10px 12px;
      color: var(--text-base);
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    .form-input:focus {
      border-color: var(--essential-bright-accent);
    }

    .btn-primary {
      background-color: var(--essential-bright-accent);
      color: #000000;
      border: none;
      border-radius: 500px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--essential-bright-accent-hover);
      transform: scale(1.02);
    }

    .btn-secondary {
      background-color: var(--bg-tinted-base);
      color: var(--text-base);
      border: none;
      border-radius: 500px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background-color: var(--bg-tinted-highlight);
    }

    /* TOAST NOTIFICATION */
    .toast {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--essential-bright-accent);
      color: #000000;
      padding: 10px 20px;
      border-radius: 500px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 2000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* MOBILE BOTTOM NAVIGATION & FULLSCREEN DRAWER */
    .mobile-bottom-nav {
      display: none;
    }

    .mobile-fullscreen-player {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        padding: 0;
        padding-top: var(--safe-top);
        gap: 0;
      }

      .top-bar {
        padding: 8px 12px;
        height: 56px;
        min-height: 56px;
      }

      .top-bar-left {
        flex: 0;
      }

      .home-btn,
      .search-divider,
      .api-status-text {
        display: none;
      }

      .top-bar-center {
        max-width: none;
        flex: 1;
      }

      .search-box {
        height: 40px;
        padding: 0 12px;
      }

      .top-bar-right {
        flex: 0;
        gap: 8px;
      }

      .workspace {
        flex: 1;
        padding: 0 8px;
        padding-bottom: calc(64px + var(--mobile-nav-height) + var(--safe-bottom));
      }

      .panel {
        border-radius: 12px;
      }

      .left-sidebar,
      .main-view {
        width: 100%;
        min-width: 100%;
        display: none;
      }

      .left-sidebar.mobile-active,
      .main-view.mobile-active {
        display: flex;
      }

      .main-view {
        padding: 14px;
      }

      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .track-row {
        grid-template-columns: 44px 1fr auto;
        padding: 8px 6px;
      }

      .track-index {
        display: none;
      }

      .player-bar {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(var(--mobile-nav-height) + var(--safe-bottom) + 4px);
        height: 58px;
        min-height: 58px;
        background-color: #222222;
        border-radius: 8px;
        padding: 6px 12px;
        z-index: 90;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.65);
      }

      .player-left {
        width: auto;
        flex: 1;
        min-width: 0;
        cursor: pointer;
      }

      .cover-placeholder {
        width: 44px;
        height: 44px;
      }

      .player-center {
        width: auto;
        flex-direction: row;
      }

      .player-center .progress-container,
      .player-center #btn-shuffle,
      .player-center #btn-prev,
      .player-center #btn-repeat,
      .player-right {
        display: none;
      }

      .play-btn {
        width: 36px;
        height: 36px;
        background: transparent;
        color: var(--text-base);
      }

      .mobile-bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(var(--mobile-nav-height) + var(--safe-bottom));
        padding-bottom: var(--safe-bottom);
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.88) 0%, #000000 40%);
        backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        z-index: 95;
        justify-content: space-around;
        align-items: center;
      }

      .mobile-tab-btn {
        background: transparent;
        border: none;
        color: var(--text-subdued);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
        flex: 1;
        height: 100%;
        cursor: pointer;
      }

      .mobile-tab-btn.active {
        color: var(--text-base);
      }

      .mobile-fullscreen-player {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #282828 0%, #121212 55%, #000000 100%);
        z-index: 500;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: calc(16px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .mobile-fullscreen-player.open {
        transform: translateY(0);
      }

      .fs-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .fs-cover {
        width: 100%;
        max-width: 340px;
        aspect-ratio: 1 / 1;
        margin: 0 auto;
        border-radius: 12px;
        overflow: hidden;
        background-color: var(--bg-elevated-highlight);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        position: relative;
      }

      .fs-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .fs-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .fs-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .fs-play-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-color: var(--text-base);
        color: #000000;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .toast {
        bottom: calc(var(--mobile-nav-height) + var(--safe-bottom) + 72px);
      }
    }

    svg {
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- NATIVES AUDIO ELEMENT FÜR SAFARI HINTERGRUNDWIEDERGABE -->
  <audio id="audio-player" playsinline preload="auto"></audio>

  <!-- TOP NAVIGATION BAR -->
  <header class="top-bar">
    <div class="top-bar-left">
      <button class="logo-btn" id="btn-logo" aria-label="Botify Start">
        <svg viewBox="0 0 24 24" width="32" height="32" style="transform: scaleX(-1);">
          <path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm5.045 15.866a.686.686 0 0 1-.943.228c-2.583-1.579-5.834-1.935-9.663-1.06a.686.686 0 0 1-.306-1.337c4.19-.957 7.785-.546 10.684 1.226a.686.686 0 0 1 .228.943zm1.346-2.995a.858.858 0 0 1-1.18.282c-2.956-1.817-7.464-2.344-10.961-1.282a.856.856 0 0 1-1.11-.904.858.858 0 0 1 .611-.737c3.996-1.212 8.962-.625 12.357 1.462a.857.857 0 0 1 .283 1.179zm.116-3.119c-3.546-2.106-9.395-2.3-12.78-1.272a1.029 1.029 0 0 1-.597-1.969c3.886-1.18 10.345-.952 14.427 1.471a1.029 1.029 0 0 1-1.05 1.77z"></path>
        </svg>
      </button>
    </div>

    <div class="top-bar-center">
      <button class="home-btn" id="btn-home" aria-label="Start">
        <svg viewBox="0 0 24 24" width="24" height="24">
          <path d="M13.5 1.515a3 3 0 0 0-3 0L3 5.845a2 2 0 0 0-1 1.732V21a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6h4v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7.577a2 2 0 0 0-1-1.732l-7.5-4.33z"></path>
        </svg>
      </button>

      <div class="search-box">
        <svg viewBox="0 0 24 24" width="22" height="22" style="color: var(--text-subdued); min-width: 22px;">
          <path d="M10.533 1.27893C5.35215 1.27893 1.12598 5.41887 1.12598 10.5579C1.12598 15.697 5.35215 19.8369 10.533 19.8369C12.767 19.8369 14.8235 19.0671 16.4402 17.7794L20.7929 22.132C21.1834 22.5226 21.8166 22.5226 22.2071 22.132C22.5976 21.7415 22.5976 21.1083 22.2071 20.7178L17.8634 16.3741C19.1616 14.7849 19.94 12.7634 19.94 10.5579C19.94 5.41887 15.7138 1.27893 10.533 1.27893ZM3.12598 10.5579C3.12598 6.55226 6.42768 3.27893 10.533 3.27893C14.6383 3.27893 17.94 6.55226 17.94 10.5579C17.94 14.5636 14.6383 17.8369 10.533 17.8369C6.42768 17.8369 3.12598 14.5636 3.12598 10.5579Z"></path>
        </svg>
        <input type="text" id="search-input" placeholder="Was möchtest du wiedergeben?" aria-label="Was möchtest du wiedergeben?">
        <div class="search-divider"></div>
        <button class="icon-btn" id="btn-custom-stream" title="Eigene Stream-URL hinzufügen" aria-label="Stream hinzufügen">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M15 15.5c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2z"></path>
            <path d="M1.513 9.37A1 1 0 0 1 2.291 9h19.418a1 1 0 0 1 .979 1.208l-2.339 11a1 1 0 0 1-.978.792H4.63a1 1 0 0 1-.978-.792l-2.339-11a1 1 0 0 1 .201-.837zM3.525 11l1.913 9h13.123l1.913-9H3.525zM4 2a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v4h-2V3H6v3H4V2z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="top-bar-right">
      <div class="api-status-badge" id="api-status-badge" title="Google API Key & Stream-Einstellungen">
        <span class="status-dot" id="api-status-dot"></span>
        <span class="api-status-text" id="api-status-text">Demo-Modus</span>
      </div>
      <button class="avatar-placeholder" id="btn-open-settings" title="Einstellungen & Google API Key" aria-label="Einstellungen">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <div class="workspace">

    <!-- LEFT SIDEBAR (LIBRARY) -->
    <aside class="panel left-sidebar" id="sidebar-panel">
      <div class="library-header">
        <div class="library-title" id="btn-library-home">
          <svg viewBox="0 0 24 24" width="24" height="24">
            <path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"></path>
          </svg>
          <span>Bibliothek</span>
        </div>
        <div class="library-actions">
          <button class="icon-btn" id="btn-create-playlist" title="Neue Playlist erstellen" aria-label="Neue Playlist erstellen">
            <svg viewBox="0 0 16 16" width="16" height="16">
              <path d="M15.25 8a.75.75 0 0 1-.75.75H8.75v5.75a.75.75 0 0 1-1.5 0V8.75H1.5a.75.75 0 0 1 0-1.5h5.75V1.5a.75.75 0 0 1 1.5 0v5.75h5.75a.75.75 0 0 1 .75.75z"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="library-list" id="library-list"></div>
    </aside>

    <!-- CENTER CONTENT AREA -->
    <main class="panel main-view mobile-active" id="main-panel">
      <div class="chips-row" id="chips-row">
        <button class="chip active" data-filter="all">Alle</button>
        <button class="chip" data-filter="recommendations">Empfehlungen</button>
        <button class="chip" data-filter="playlists">Playlists</button>
        <button class="chip" data-filter="queue">Warteschlange</button>
      </div>

      <div id="main-content"></div>
    </main>

  </div>

  <!-- BOTTOM PLAYER BAR -->
  <footer class="player-bar">
    <div class="player-left" id="mini-player-trigger">
      <div class="cover-placeholder" id="player-cover">
        <svg viewBox="0 0 24 24" width="24" height="24" style="color: var(--text-subdued);">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path>
        </svg>
      </div>
      <div class="now-playing-info">
        <div class="now-playing-title" id="player-title">Kein Titel ausgewählt</div>
        <div class="now-playing-artist" id="player-artist">Wähle einen Song aus</div>
      </div>
      <button class="icon-btn" id="btn-like-current" title="Zu Lieblingssongs hinzufügen" aria-label="Gefällt mir">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8z"></path>
          <path d="M11.75 8a.75.75 0 0 1-.75.75H8.75V11a.75.75 0 0 1-1.5 0V8.75H5a.75.75 0 0 1 0-1.5h2.25V5a.75.75 0 0 1 1.5 0v2.25H11a.75.75 0 0 1 .75.75z"></path>
        </svg>
      </button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="icon-btn" id="btn-shuffle" aria-label="Zufallswiedergabe" title="Zufallswiedergabe">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <path d="M13.151.922a.75.75 0 1 0-1.06 1.06L13.109 3H11.16a3.75 3.75 0 0 0-2.873 1.34l-6.173 7.356A2.25 2.25 0 0 1 .39 12.5H0V14h.391a3.75 3.75 0 0 0 2.873-1.34l6.173-7.356a2.25 2.25 0 0 1 1.724-.804h1.947l-1.017 1.018a.75.75 0 0 0 1.06 1.06L15.98 3.75 13.15.922zM.391 3.5H0V2h.391c1.109 0 2.16.49 2.873 1.34L4.89 5.277l-.979 1.167-1.796-2.14A2.25 2.25 0 0 0 .39 3.5z"></path>
            <path d="m7.5 10.723.98-1.167.957 1.14a2.25 2.25 0 0 0 1.724.804h1.947l-1.017-1.018a.75.75 0 1 1 1.06-1.06l2.829 2.828-2.829 2.828a.75.75 0 1 1-1.06-1.06L13.109 13H11.16a3.75 3.75 0 0 1-2.873-1.34l-.787-.938z"></path>
          </svg>
        </button>

        <button class="icon-btn" id="btn-prev" aria-label="Zurück" title="Vorheriger Titel">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <path d="M3.3 1a.7.7 0 0 1 .7.7v5.15l9.95-5.744a.7.7 0 0 1 1.05.606v12.575a.7.7 0 0 1-1.05.607L4 9.149V14.3a.7.7 0 0 1-.7.7H1.7a.7.7 0 0 1-.7-.7V1.7a.7.7 0 0 1 .7-.7h1.6z"></path>
          </svg>
        </button>

        <button class="play-btn" id="btn-play" aria-label="Wiedergabe" title="Wiedergabe / Pause">
          <svg id="icon-play" viewBox="0 0 16 16" width="16" height="16">
            <path d="M3 1.713a.7.7 0 0 1 1.05-.607l10.89 6.288a.7.7 0 0 1 0 1.212L4.05 14.894A.7.7 0 0 1 3 14.288V1.713z"></path>
          </svg>
          <svg id="icon-pause" viewBox="0 0 16 16" width="16" height="16" style="display: none;">
            <path d="M2.7 1a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7H2.7zm8 0a.7.7 0 0 0-.7.7v12.6a.7.7 0 0 0 .7.7h2.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-2.6z"></path>
          </svg>
        </button>

        <button class="icon-btn" id="btn-next" aria-label="Weiter" title="Nächster Titel">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <path d="M12.7 1a.7.7 0 0 0-.7.7v5.15L2.05 1.107A.7.7 0 0 0 1 1.712v12.575a.7.7 0 0 0 1.05.607L12 9.149V14.3a.7.7 0 0 0 .7.7h1.6a.7.7 0 0 0 .7-.7V1.7a.7.7 0 0 0-.7-.7h-1.6z"></path>
          </svg>
        </button>

        <button class="icon-btn" id="btn-repeat" aria-label="Wiederholen" title="Wiederholen">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <path d="M0 4.75A3.75 3.75 0 0 1 3.75 1h8.5A3.75 3.75 0 0 1 16 4.75v5a3.75 3.75 0 0 1-3.75 3.75H9.81l1.018 1.018a.75.75 0 1 1-1.06 1.06L6.939 12.75l2.829-2.828a.75.75 0 1 1 1.06 1.06L9.811 12h2.439a2.25 2.25 0 0 0 2.25-2.25v-5a2.25 2.25 0 0 0-2.25-2.25h-8.5A2.25 2.25 0 0 0 1.5 4.75v5A2.25 2.25 0 0 0 3.75 12H5v1.5H3.75A3.75 3.75 0 0 1 0 9.75v-5z"></path>
          </svg>
        </button>
      </div>

      <div class="progress-container">
        <span id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn" id="btn-queue" aria-label="Warteschlange" title="Warteschlange">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path d="M15 15H1v-1.5h14V15zm0-4.5H1V9h14v1.5zm-14-7A2.5 2.5 0 0 1 3.5 1h9a2.5 2.5 0 0 1 0 5h-9A2.5 2.5 0 0 1 1 3.5zm2.5-1a1 1 0 0 0 0 2h9a1 1 0 1 0 0-2h-9z"></path>
        </svg>
      </button>

      <button class="icon-btn" id="btn-mute" aria-label="Lautstärke" title="Stummschalten">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path d="M9.741.85a.75.75 0 0 1 .375.65v13a.75.75 0 0 1-1.125.65l-6.925-4a3.642 3.642 0 0 1-1.33-4.967 3.639 3.639 0 0 1 1.33-1.332l6.925-4a.75.75 0 0 1 .75 0zm-6.924 5.3a2.139 2.139 0 0 0 0 3.7l5.8 3.35V2.8l-5.8 3.35zm8.683 4.29V5.56a2.75 2.75 0 0 1 0 4.88z"></path>
        </svg>
      </button>
      <div class="volume-bar" id="volume-bar">
        <div class="volume-fill" id="volume-fill"></div>
      </div>
    </div>
  </footer>

  <!-- MODAL: EINSTELLUNGEN -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Einstellungen & API</h2>
        <button class="icon-btn" id="btn-close-settings">✕</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="input-google-api-key">Google API Key (YouTube Data API v3)</label>
        <input type="password" class="form-input" id="input-google-api-key" placeholder="AIzaSy...">
      </div>

      <div class="form-group">
        <label class="form-label" for="input-stream-proxy">Audio-Stream-Proxy URL</label>
        <input type="url" class="form-input" id="input-stream-proxy" value="https://botify-aurb.onrender.com">
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px;">
        <button class="btn-secondary" id="btn-clear-settings">Zurücksetzen</button>
        <button class="btn-primary" id="btn-save-settings">Speichern</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const audio = document.getElementById('audio-player');
    const PROXY_URL = 'https://botify-aurb.onrender.com';

    const STORAGE_KEYS = {
      API_KEY: 'botify_google_api_key_v1',
      STREAM_PROXY: 'botify_stream_proxy_v1',
      PLAYLISTS: 'botify_playlists_v1',
      VOLUME: 'botify_volume_v1'
    };

    const DEMO_TRACKS = [
      {
        id: 'demo-1',
        title: 'Lofi Study Beats',
        artist: 'Botify Chill',
        album: 'Lofi Session',
        duration: 180,
        cover: 'https://placehold.co/400x400/121212/1ed760?text=Lofi',
        audioUrl: 'https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf7f6.mp3'
      }
    ];

    let state = {
      apiKey: localStorage.getItem(STORAGE_KEYS.API_KEY) || '',
      streamProxy: localStorage.getItem(STORAGE_KEYS.STREAM_PROXY) || PROXY_URL,
      volume: parseFloat(localStorage.getItem(STORAGE_KEYS.VOLUME) || '0.8'),
      queue: [...DEMO_TRACKS],
      currentIndex: -1,
      isPlaying: false,
      searchQuery: '',
      searchResults: [],
      activeView: 'all',
      playlists: [
        { id: 'liked', name: 'Lieblingssongs', tracks: [] },
        { id: 'playlist-1', name: 'Entspannte Beats', tracks: [DEMO_TRACKS[0]] }
      ]
    };

    audio.volume = state.volume;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    async function resolveBackgroundAudioStream(videoId) {
      try {
        const proxyBase = (state.streamProxy || PROXY_URL).replace(/\/+$/, '');
        const res = await fetch(`${proxyBase}/${videoId}`);
        if (res.ok) {
          const data = await res.json();
          if (data.url) return data.url;
        }
      } catch (err) {
        console.error("Proxy-Fehler:", err);
      }
      return null;
    }

    async function loadAndPlayTrack(index, customQueue = null) {
      if (customQueue) state.queue = [...customQueue];
      if (index < 0 || index >= state.queue.length) return;

      audio.pause();
      state.currentIndex = index;
      const track = state.queue[index];

      let directAudioUrl = track.audioUrl || null;
      if (!directAudioUrl && track.videoId) {
        showToast('Lade Audio-Stream...');
        directAudioUrl = await resolveBackgroundAudioStream(track.videoId);
      }

      if (directAudioUrl) {
        audio.src = directAudioUrl;
        audio.load();
        try {
          await audio.play();
          state.isPlaying = true;
          return;
        } catch (e) {}
      }
      showToast('Stream konnte nicht geladen werden.');
    }

    document.getElementById('btn-play').addEventListener('click', () => {
      if (state.currentIndex === -1 && state.queue.length > 0) {
        loadAndPlayTrack(0);
      } else if (state.isPlaying) {
        audio.pause();
        state.isPlaying = false;
      } else {
        audio.play();
        state.isPlaying = true;
      }
    });

    document.getElementById('btn-open-settings').addEventListener('click', () => {
      document.getElementById('input-google-api-key').value = state.apiKey;
      document.getElementById('input-stream-proxy').value = state.streamProxy;
      document.getElementById('settings-modal').classList.add('open');
    });

    document.getElementById('btn-close-settings').addEventListener('click', () => {
      document.getElementById('settings-modal').classList.remove('open');
    });

    document.getElementById('btn-save-settings').addEventListener('click', () => {
      state.apiKey = document.getElementById('input-google-api-key').value.trim();
      state.streamProxy = document.getElementById('input-stream-proxy').value.trim() || PROXY_URL;
      localStorage.setItem(STORAGE_KEYS.API_KEY, state.apiKey);
      localStorage.setItem(STORAGE_KEYS.STREAM_PROXY, state.streamProxy);
      document.getElementById('settings-modal').classList.remove('open');
      showToast('Gespeichert');
    });
  </script>
</body>
</html>
